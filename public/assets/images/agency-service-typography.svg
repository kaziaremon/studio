      <polygon points="400,308 404,312 400,316 396,312" fill="#C5A059"/>
      <line x1="425" y1="312" x2="580" y2="312" stroke="#2A3745" stroke-width="1"/>

      <!-- Central Phrase 2: PERFORMANCE MARKETING -->
