    <text x="115" y="504" class="sage" font-size="14.5" font-weight="700" letter-spacing="1.5">LINKEDIN OPTIMIZATION</text>
    <text x="352" y="504" class="muted-slate" font-size="13">•</text>
    <text x="372" y="504" class="gold" font-size="15.5" font-weight="700" letter-spacing="1.6">FACEBOOK MARKETING</text>
    <text x="685" y="504" text-anchor="end" class="offwhite" font-size="14" font-weight="600" letter-spacing="1.2">SOCIAL MEDIA OPTIMIZATION</text>

    <!-- Row 7: Media Buying, Instagram Marketing, Active Platform Workflows -->
    <text x="115" y="544" class="offwhite" font-size="15.5" font-weight="800" letter-spacing="2">MEDIA BUYING</text>
    <path d="M260 539 L263 534 L266 539 L263 544 Z" fill="#C5A059"/>
    <text x="282" y="544" class="gold" font-size="14" font-weight="600" letter-spacing="1.5">INSTAGRAM MARKETING</text>
    <text x="495" y="544" class="muted-slate" font-size="13">•</text>
    <text x="685" y="544" text-anchor="end" class="sage" font-size="13.5" font-weight="600" letter-spacing="1.2">ACTIVE PLATFORM WORKFLOWS</text>

