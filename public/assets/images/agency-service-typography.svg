  <!-- Outer Understated Framing Border -->
  <rect x="24" y="24" width="752" height="592" rx="14" fill="none" stroke="#222B36" stroke-width="1.2"/>
  <rect x="32" y="32" width="736" height="576" rx="10" fill="none" stroke="#18202A" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Four Artistic Corner Embellishments (Muted Gold) -->
  <!-- Top Left -->
  <path d="M20 36 L20 20 L36 20" fill="none" stroke="#C5A059" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="20" cy="20" r="1.5" fill="#C5A059"/>
  <!-- Top Right -->
  <path d="M764 20 L780 20 L780 36" fill="none" stroke="#C5A059" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="780" cy="20" r="1.5" fill="#C5A059"/>
  <!-- Bottom Left -->
  <path d="M20 604 L20 620 L36 620" fill="none" stroke="#C5A059" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="20" cy="620" r="1.5" fill="#C5A059"/>
  <!-- Bottom Right -->
  <path d="M764 620 L780 620 L780 604" fill="none" stroke="#C5A059" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="780" cy="620" r="1.5" fill="#C5A059"/>

  <!-- Top Header Metadata Row -->
  <g class="font-sans">
    <text x="56" y="60" class="gold" font-size="10" font-weight="700" letter-spacing="3.5">WHIZ STUDIO</text>
    <text x="400" y="60" text-anchor="middle" class="sage" font-size="9" font-weight="600" letter-spacing="3">AGENCY CORE SERVICE SPECIFICATION</text>
    <text x="744" y="60" text-anchor="end" class="offwhite" font-size="9.5" font-weight="600" letter-spacing="2.5">EDITION 2026</text>
