<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Poppins:wght@600;700;800;900&amp;display=swap');
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-display { font-family: 'Poppins', 'Inter', sans-serif; }
      .gold { fill: #C5A059; }
      .gold-stroke { stroke: #C5A059; }
      .sage { fill: #8DA892; }
      .sage-stroke { stroke: #8DA892; }
      .offwhite { fill: #F1F5F9; }
      .offwhite-stroke { stroke: #F1F5F9; }
