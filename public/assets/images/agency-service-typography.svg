    <!-- Small checkmark icon -->
    <path d="M292 153 L296 157 L304 148" fill="none" stroke="#C5A059" stroke-width="1.6" stroke-linecap="round"/>
    <text x="314" y="158" class="gold" font-size="17" font-weight="800" letter-spacing="2.2">MEDIA BUYING</text>
    <text x="475" y="158" class="muted-slate" font-size="13">•</text>
