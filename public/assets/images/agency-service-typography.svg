    <line x1="56" y1="570" x2="744" y2="570" stroke="#1E2732" stroke-width="1"/>
    <text x="56" y="596" class="sage" font-size="9" font-weight="600" letter-spacing="2">100% CLIENT-OWNED ACCOUNTS</text>
    <text x="400" y="596" text-anchor="middle" class="offwhite" font-size="9" font-weight="600" letter-spacing="2.2">DATA INFRASTRUCTURE • STRICT HYGIENE • NO GUESSWORK</text>
    <text x="744" y="596" text-anchor="end" class="gold" font-size="9" font-weight="700" letter-spacing="2">WHIZSTUDIO.ART</text>
  </g>
</svg>
