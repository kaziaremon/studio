    <!-- Row 4: Active Platform Workflows, Divider, Conversion Hygiene, Divider, B2B Executive Authority -->
    <text x="115" y="424" class="offwhite" font-size="14.5" font-weight="600" letter-spacing="1.5">ACTIVE PLATFORM WORKFLOWS</text>
