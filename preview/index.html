<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0F172A] text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Whiz Studio | Dashboard & Portal Interactive Device Simulator</title>
  <link rel="icon" type="image/png" href="../favicon.png">

  <!-- Google Fonts: Inter, Poppins & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- FontAwesome 6.5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              whiz: '#147D64',
              emerald: '#059669',
              accent: '#00A86B',
              dark: '#172B36',
              deep: '#065F46',
              light: '#F4FAF7',
              border: '#E3E9EF',
              muted: '#5F7180'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            display: ['Poppins', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    /* Custom Ambient Lighting */
    .simulator-ambient {
      background: radial-gradient(circle at 10% 15%, rgba(20, 125, 100, 0.15) 0%, transparent 45%),
                  radial-gradient(circle at 90% 85%, rgba(0, 168, 107, 0.12) 0%, transparent 50%),
                  #0F172A;
    }

    /* Device Hardware Chassis */
    .phone-chassis {
      border: 12px solid #1E293B;
      border-radius: 48px;
      box-shadow: 0 25px 75px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.12);
      background: #FFFFFF;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .tablet-chassis {
      border: 14px solid #1E293B;
      border-radius: 32px;
      box-shadow: 0 30px 80px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
      background: #FFFFFF;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .laptop-chassis {
      border: 12px solid #1E293B;
      border-radius: 20px;
      box-shadow: 0 35px 90px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.1);
      background: #FFFFFF;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Notch & Camera Pill */
    .phone-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 24px;
      background: #000000;
      border-radius: 9999px;
      z-index: 50;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
    }

    .phone-island .camera {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background: #111827;
      border: 1px solid #1f2937;
    }

    .phone-island .sensor {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: #064e3b;
      opacity: 0.8;
    }

    .laptop-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 12px;
      background: #1E293B;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      z-index: 50;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .laptop-notch .camera {
      width: 5px;
      height: 5px;
      border-radius: 9999px;
      background: #059669;
    }

    /* Custom Toolbar Select Styling */
    .ctrl-select {
      background: rgba(30, 41, 59, 0.9);
      color: #F8FAFC;
      border: 1px solid rgba(71, 85, 105, 0.6);
      border-radius: 0.625rem;
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ctrl-select:hover, .ctrl-select:focus {
      border-color: #147D64;
      background: rgba(30, 41, 59, 1);
    }

    .btn-quick {
      padding: 0.4rem 0.75rem;
      border-radius: 0.625rem;
      font-size: 0.75rem;
      font-weight: 700;
      transition: all 0.2s;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    /* Smooth scaling container */
    #deviceChassisContainer {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="h-full simulator-ambient flex flex-col overflow-hidden font-sans antialiased select-none">

  <!-- =========================================================================
       1. TOP CONTROL TOOLBAR: HARDWARE SIMULATOR CONTROLS
       ========================================================================= -->
  <header class="bg-[#172B36]/95 backdrop-blur-xl border-b border-slate-700/80 px-3 sm:px-4 py-2 shrink-0 z-50 shadow-lg">
    <div class="max-w-[1920px] mx-auto flex flex-col xl:flex-row items-center justify-between gap-2.5 text-xs">
      
      <!-- Brand & Mode Title -->
      <div class="flex items-center space-x-3 w-full xl:w-auto justify-between xl:justify-start">
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-500 to-[#147D64] flex items-center justify-center font-black text-white font-display text-sm shadow-md shrink-0">
            W
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-extrabold tracking-tight text-white font-display text-sm">Whiz Studio</span>
              <span class="px-2 py-0.5 rounded-full text-[9px] font-mono font-black uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">Hardware Simulator v5.0</span>
            </div>
            <p class="text-[10px] text-slate-400 font-medium">True Device Viewports • Real D1 Caches • Zero Visual Distortion</p>
          </div>
        </div>

        <!-- Frame & Direct Links (Visible on right on mobile headers) -->
        <div class="flex items-center space-x-1.5 xl:hidden">
          <button type="button" id="btnToggleFrameMobile" class="p-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white border border-slate-700 text-xs">
            <i class="fa-solid fa-mobile-screen"></i>
          </button>
          <button type="button" id="btnOpenDirectMobile" class="p-1.5 rounded-lg bg-emerald-600 text-white text-xs" title="Open View in New Tab">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </button>
        </div>
      </div>

      <!-- 5-VIEW QUICK SWITCHER BUTTONS (Primary Navigation) -->
      <div class="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-700/80 space-x-1 overflow-x-auto max-w-full">
        <button type="button" class="btn-quick bg-emerald-600 text-white shadow-sm" data-view="super-admin-desktop">
          <span>👑 Expanded Dock (260px)</span>
        </button>
        <button type="button" class="btn-quick text-slate-300 hover:text-white hover:bg-slate-800" data-view="super-admin-collapsed">
          <span>🗜️ Collapsed Dock (72px)</span>
        </button>
        <button type="button" class="btn-quick text-slate-300 hover:text-white hover:bg-slate-800" data-view="super-admin-mobile">
          <span>📱 Mobile Overview</span>
        </button>
        <button type="button" class="btn-quick text-slate-300 hover:text-white hover:bg-slate-800" data-view="super-admin-drawer">
          <span>📑 Mobile Drawer</span>
        </button>
        <button type="button" class="btn-quick text-slate-300 hover:text-white hover:bg-slate-800" data-view="client-desktop">
          <span>👤 Client Desktop</span>
        </button>
        <button type="button" class="btn-quick text-slate-300 hover:text-white hover:bg-slate-800 hidden sm:inline-flex" data-view="tablet">
          <span>📟 Tablet</span>
        </button>
      </div>

      <!-- GRANULAR SIMULATOR CONTROLS: Role, Device Dimension, Page Jumper, Zoom -->
      <div class="flex items-center space-x-2 w-full xl:w-auto justify-between xl:justify-end overflow-x-auto pb-1 xl:pb-0">
        
        <!-- Role Dropdown -->
        <div class="flex items-center space-x-1">
          <span class="text-slate-400 text-[10px] uppercase font-bold hidden sm:inline">Role:</span>
          <select id="selectRole" class="ctrl-select">
            <option value="super_admin">👑 Super Admin</option>
            <option value="admin">🛡️ Admin</option>
            <option value="accounts">💳 Accounts</option>
            <option value="employee">👷 Employee</option>
            <option value="client">👤 Client</option>
          </select>
        </div>

        <!-- Page / Tab Direct Linker -->
        <div class="flex items-center space-x-1">
          <span class="text-slate-400 text-[10px] uppercase font-bold hidden sm:inline">Page:</span>
          <select id="selectTab" class="ctrl-select">
            <!-- Dynamically populated per Portal mode -->
          </select>
        </div>

        <!-- Exact Device Dimension Dropdown -->
        <div class="flex items-center space-x-1">
          <span class="text-slate-400 text-[10px] uppercase font-bold hidden sm:inline">Device:</span>
          <select id="selectDevice" class="ctrl-select">
            <option value="320x640">320 × 640 (Compact / SE1)</option>
            <option value="360x740">360 × 740 (Galaxy S)</option>
            <option value="375x667">375 × 667 (iPhone SE3)</option>
            <option value="390x844" selected>390 × 844 (iPhone 15)</option>
            <option value="393x852">393 × 852 (iPhone 16 Pro)</option>
            <option value="414x896">414 × 896 (iPhone XR)</option>
            <option value="428x926">428 × 926 (iPhone Plus)</option>
            <option value="430x932">430 × 932 (iPhone Pro Max)</option>
            <option value="768x1024">768 × 1024 (iPad Portrait)</option>
            <option value="1024x768">1024 × 768 (iPad Landscape)</option>
            <option value="1280x800">1280 × 800 (MacBook Air 13")</option>
            <option value="1366x768">1366 × 768 (Standard Laptop)</option>
            <option value="1440x900">1440 × 900 (MacBook Pro 15")</option>
            <option value="1920x1080">1920 × 1080 (Desktop FHD)</option>
            <option value="fluid">Fluid (100% Window)</option>
          </select>
        </div>

        <!-- Zoom / Auto-Fit Dropdown -->
        <div class="flex items-center space-x-1">
          <select id="selectZoom" class="ctrl-select">
            <option value="fit" selected>Auto-Fit</option>
            <option value="1.0">100% (1:1)</option>
            <option value="0.85">85%</option>
            <option value="0.75">75%</option>
            <option value="0.5">50%</option>
          </select>
        </div>

        <!-- Rotate Device Orientation Button -->
        <button type="button" id="btnRotateOrientation" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition-colors cursor-pointer" title="Rotate Device Orientation">
          <i class="fa-solid fa-rotate text-xs"></i>
        </button>

        <!-- Hardware Frame Toggle (Desktop) -->
        <button type="button" id="btnToggleFrame" class="hidden xl:inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition-colors text-xs font-semibold cursor-pointer">
          <i class="fa-solid fa-mobile-screen"></i>
          <span id="labelFrameToggle">Frame: ON</span>
        </button>

        <!-- Direct Open in New Tab -->
        <button type="button" id="btnOpenDirect" class="hidden xl:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold transition-all text-xs cursor-pointer shadow-sm" title="Open Clean View in New Tab">
          <i class="fa-solid fa-arrow-up-right-from-square text-[11px]"></i>
          <span>Direct View</span>
        </button>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       2. WORKSPACE CANVAS: VIEWPORT CENTER WITH PROPORTIONAL SCALING
       ========================================================================= -->
  <main id="previewWorkspace" class="flex-1 w-full overflow-auto flex items-center justify-center p-4 relative">
    
    <!-- Proportional Scaler Wrapper -->
    <div id="deviceChassisContainer" class="flex items-center justify-center relative">
      
      <!-- Device Hardware Chassis Frame -->
      <div id="deviceChassis" class="phone-chassis relative transition-all shadow-2xl">
        
        <!-- iPhone Dynamic Island (Shown on mobile smartphones) -->
        <div id="phoneIsland" class="phone-island">
          <div class="camera"></div>
          <div class="sensor"></div>
        </div>

        <!-- MacBook Camera Notch (Shown on laptops) -->
        <div id="laptopNotch" class="laptop-notch hidden">
          <div class="camera"></div>
        </div>

        <!-- The Isolated True Viewport Iframe -->
        <iframe id="previewIframe"
                src="/admin/dashboard/?preview=1&role=super_admin#overview"
                class="w-full h-full border-0 bg-white"
                allow="clipboard-write; notifications"
                title="Whiz Studio Dashboard Workspace">
        </iframe>

      </div>
    </div>

  </main>

  <!-- =========================================================================
       3. SIMULATOR CONTROLLER SCRIPT
       ========================================================================= -->
  <script>
    (function () {
      'use strict';

      // Simulator State
      const state = {
        portalType: 'admin', // 'admin' | 'client'
        role: 'super_admin',
        activeTab: 'overview',
        deviceWidth: 390,
        deviceHeight: 844,
        isFluid: false,
        zoomMode: 'fit',
        frameActive: true,
        orientation: 'portrait'
      };

      // Tab definitions for Admin & Client
      const adminTabs = [
        { id: 'overview', label: '📊 Overview & KPIs' },
        { id: 'clients', label: '👥 Client Directory' },
        { id: 'services', label: '📦 Service Management' },
        { id: 'service_tasks', label: '📑 SOP Blueprint Workspace' },
        { id: 'projects', label: '📁 Service Projects' },
        { id: 'tasks', label: '✅ Live Tasks (SOPs)' },
        { id: 'finance', label: '💳 Payments & Ledger' },
        { id: 'receipt_template', label: '🧾 Vector Receipt Template' },
        { id: 'team', label: '🛡️ User & Access (RBAC)' },
        { id: 'support', label: '🎧 Support Desk' },
        { id: 'history', label: '⏱️ Audit & History Log' },
        { id: 'security', label: '🔐 Security & Devices' }
      ];

      const clientTabs = [
        { id: 'overview', label: '📊 Workspace Overview' },
        { id: 'services', label: '📦 My Active Services' },
        { id: 'tasks', label: '✅ Deliverables & Roadmap' },
        { id: 'finance', label: '💳 Invoices & Receipts' },
        { id: 'support', label: '🎧 Support & Requests' },
        { id: 'settings', label: '⚙️ Account Settings & CIF' }
      ];

      const iframe = document.getElementById('previewIframe');
      const chassis = document.getElementById('deviceChassis');
      const container = document.getElementById('deviceChassisContainer');
      const workspace = document.getElementById('previewWorkspace');
      const selectTab = document.getElementById('selectTab');
      const selectRole = document.getElementById('selectRole');
      const selectDevice = document.getElementById('selectDevice');
      const selectZoom = document.getElementById('selectZoom');
      const phoneIsland = document.getElementById('phoneIsland');
      const laptopNotch = document.getElementById('laptopNotch');
      const labelFrameToggle = document.getElementById('labelFrameToggle');

      // Detect protocol for portable relative resolution
      function getDashboardUrl(portal, role, tab) {
        const isFile = window.location.protocol === 'file:';
        let base = '';
        if (portal === 'client') {
          base = isFile ? '../client/dashboard/index.html' : '/client/dashboard/';
          return `${base}?preview=1&role=client#${tab || 'overview'}`;
        } else {
          base = isFile ? '../admin/dashboard/index.html' : '/admin/dashboard/';
          const r = role === 'super_admin' ? 'super_admin' : role;
          return `${base}?preview=1&role=${r}#${tab || 'overview'}`;
        }
      }

      function populateTabsDropdown() {
        const tabs = state.portalType === 'client' ? clientTabs : adminTabs;
        selectTab.innerHTML = tabs.map(t => `<option value="${t.id}">${t.label}</option>`).join('');
        selectTab.value = state.activeTab;
      }

      function updateIframeSrc() {
        const targetUrl = getDashboardUrl(state.portalType, state.role, state.activeTab);
        if (iframe.contentWindow && iframe.contentWindow.location) {
          try {
            const curPath = iframe.contentWindow.location.pathname;
            const curHash = (iframe.contentWindow.location.hash || '').replace('#', '');
            const targetPath = state.portalType === 'client' ? '/client/dashboard/' : '/admin/dashboard/';
            
            // If already on the same dashboard page, just change hash to avoid full reload
            if (curPath.includes(targetPath) || curPath.includes(state.portalType)) {
              if (curHash !== state.activeTab) {
                iframe.contentWindow.location.hash = '#' + state.activeTab;
                return;
              }
            }
          } catch (e) {
            // Cross-origin fallback
          }
        }
        iframe.src = targetUrl;
      }

      function applyDeviceDimensions() {
        if (state.isFluid || !state.frameActive) {
          chassis.className = 'w-full h-full relative transition-all rounded-none border-0 shadow-none';
          chassis.style.width = '100%';
          chassis.style.height = '100%';
          container.style.width = '100%';
          container.style.height = '100%';
          container.style.transform = 'none';
          phoneIsland.classList.add('hidden');
          laptopNotch.classList.add('hidden');
          return;
        }

        const w = state.orientation === 'portrait' ? state.deviceWidth : state.deviceHeight;
        const h = state.orientation === 'portrait' ? state.deviceHeight : state.deviceWidth;

        chassis.style.width = `${w}px`;
        chassis.style.height = `${h}px`;

        if (w <= 430) {
          chassis.className = 'phone-chassis relative transition-all shadow-2xl';
          phoneIsland.classList.remove('hidden');
          laptopNotch.classList.add('hidden');
        } else if (w <= 1024) {
          chassis.className = 'tablet-chassis relative transition-all shadow-2xl';
          phoneIsland.classList.add('hidden');
          laptopNotch.classList.add('hidden');
        } else {
          chassis.className = 'laptop-chassis relative transition-all shadow-2xl';
          phoneIsland.classList.add('hidden');
          laptopNotch.classList.remove('hidden');
        }

        updateScaling();
      }

      // Proportional Auto-Fit Scaling (Guarantees zero squishing of iframe content)
      function updateScaling() {
        if (state.isFluid || !state.frameActive) {
          container.style.transform = 'none';
          return;
        }

        const w = state.orientation === 'portrait' ? state.deviceWidth : state.deviceHeight;
        const h = state.orientation === 'portrait' ? state.deviceHeight : state.deviceWidth;

        // Reserve 40px padding in workspace
        const availW = Math.max(300, workspace.clientWidth - 48);
        const availH = Math.max(300, workspace.clientHeight - 48);

        let scale = 1.0;
        if (state.zoomMode === 'fit') {
          const scaleW = availW / (w + 24); // plus bezel
          const scaleH = availH / (h + 24);
          scale = Math.min(1.0, Math.min(scaleW, scaleH));
        } else {
          scale = parseFloat(state.zoomMode);
        }

        container.style.transform = `scale(${scale.toFixed(3)})`;
        container.style.transformOrigin = 'center center';
      }

      function setQuickView(viewName) {
        document.querySelectorAll('.btn-quick').forEach(b => {
          if (b.dataset.view === viewName) {
            b.classList.add('bg-emerald-600', 'text-white', 'shadow-sm');
            b.classList.remove('text-slate-300');
          } else {
            b.classList.remove('bg-emerald-600', 'text-white', 'shadow-sm');
            b.classList.add('text-slate-300');
          }
        });

        if (viewName === 'super-admin-desktop') {
          state.portalType = 'admin';
          state.role = 'super_admin';
          state.activeTab = 'overview';
          state.deviceWidth = 1440;
          state.deviceHeight = 900;
          state.isFluid = false;
          selectDevice.value = '1440x900';
          selectRole.value = 'super_admin';
          setTimeout(() => {
            try {
              const doc = iframe.contentWindow?.document;
              const sidebar = doc?.getElementById('adminDesktopSidebar');
              if (sidebar && sidebar.getAttribute('data-collapsed') === 'true') {
                doc.getElementById('sidebarCollapseToggleBtn')?.click();
              }
            } catch (e) {}
          }, 350);
        } else if (viewName === 'super-admin-collapsed') {
          state.portalType = 'admin';
          state.role = 'super_admin';
          state.activeTab = 'overview';
          state.deviceWidth = 1440;
          state.deviceHeight = 900;
          state.isFluid = false;
          selectDevice.value = '1440x900';
          selectRole.value = 'super_admin';
          setTimeout(() => {
            try {
              const doc = iframe.contentWindow?.document;
              const sidebar = doc?.getElementById('adminDesktopSidebar');
              if (sidebar && sidebar.getAttribute('data-collapsed') !== 'true') {
                doc.getElementById('sidebarCollapseToggleBtn')?.click();
              }
            } catch (e) {}
          }, 350);
        } else if (viewName === 'super-admin-drawer') {
          state.portalType = 'admin';
          state.role = 'super_admin';
          state.activeTab = 'overview';
          state.deviceWidth = 390;
          state.deviceHeight = 844;
          state.isFluid = false;
          selectDevice.value = '390x844';
          selectRole.value = 'super_admin';
          setTimeout(() => {
            try {
              const doc = iframe.contentWindow?.document;
              const drawer = doc?.getElementById('mobileDrawer');
              if (drawer && drawer.classList.contains('-translate-x-full')) {
                doc.getElementById('mobileMenuToggleBtn')?.click();
              }
            } catch (e) {}
          }, 450);
        } else if (viewName === 'super-admin-mobile') {
          state.portalType = 'admin';
          state.role = 'super_admin';
          state.activeTab = 'overview';
          state.deviceWidth = 390;
          state.deviceHeight = 844;
          state.isFluid = false;
          selectDevice.value = '390x844';
          selectRole.value = 'super_admin';
        } else if (viewName === 'client-desktop') {
          state.portalType = 'client';
          state.role = 'client';
          state.activeTab = 'overview';
          state.deviceWidth = 1280;
          state.deviceHeight = 800;
          state.isFluid = false;
          selectDevice.value = '1280x800';
          selectRole.value = 'client';
        } else if (viewName === 'client-mobile') {
          state.portalType = 'client';
          state.role = 'client';
          state.activeTab = 'overview';
          state.deviceWidth = 390;
          state.deviceHeight = 844;
          state.isFluid = false;
          selectDevice.value = '390x844';
          selectRole.value = 'client';
        } else if (viewName === 'tablet') {
          state.portalType = 'admin';
          state.role = 'super_admin';
          state.activeTab = 'overview';
          state.deviceWidth = 768;
          state.deviceHeight = 1024;
          state.isFluid = false;
          selectDevice.value = '768x1024';
          selectRole.value = 'super_admin';
        }

        populateTabsDropdown();
        applyDeviceDimensions();
        updateIframeSrc();
      }

      // Event Listeners
      document.querySelectorAll('.btn-quick').forEach(btn => {
        btn.addEventListener('click', () => setQuickView(btn.dataset.view));
      });

      selectDevice.addEventListener('change', (e) => {
        const val = e.target.value;
        if (val === 'fluid') {
          state.isFluid = true;
        } else {
          state.isFluid = false;
          const [w, h] = val.split('x').map(Number);
          state.deviceWidth = w;
          state.deviceHeight = h;
        }
        applyDeviceDimensions();
      });

      selectRole.addEventListener('change', (e) => {
        const role = e.target.value;
        state.role = role;
        state.portalType = role === 'client' ? 'client' : 'admin';
        populateTabsDropdown();
        updateIframeSrc();
      });

      selectTab.addEventListener('change', (e) => {
        state.activeTab = e.target.value;
        updateIframeSrc();
      });

      selectZoom.addEventListener('change', (e) => {
        state.zoomMode = e.target.value;
        updateScaling();
      });

      document.getElementById('btnRotateOrientation')?.addEventListener('click', () => {
        state.orientation = state.orientation === 'portrait' ? 'landscape' : 'portrait';
        applyDeviceDimensions();
      });

      function toggleFrame() {
        state.frameActive = !state.frameActive;
        labelFrameToggle.textContent = state.frameActive ? 'Frame: ON' : 'Frame: OFF';
        applyDeviceDimensions();
      }

      document.getElementById('btnToggleFrame')?.addEventListener('click', toggleFrame);
      document.getElementById('btnToggleFrameMobile')?.addEventListener('click', toggleFrame);

      function openDirectView() {
        const url = getDashboardUrl(state.portalType, state.role, state.activeTab);
        window.open(url, '_blank');
      }

      document.getElementById('btnOpenDirect')?.addEventListener('click', openDirectView);
      document.getElementById('btnOpenDirectMobile')?.addEventListener('click', openDirectView);

      window.addEventListener('resize', () => {
        if (state.zoomMode === 'fit') updateScaling();
      });

      // Initialize with Admin Desktop or Mobile from URL params if specified
      const urlParams = new URLSearchParams(window.location.search);
      const initView = urlParams.get('view') || 'super-admin-desktop';
      setQuickView(initView);

    })();
  </script>

</body>
</html>
