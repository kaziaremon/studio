version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whiz_studio_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=whiz_production_super_key_2026
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:5173"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: whiz_studio_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
